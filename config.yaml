# =====================================================================
# Configuración del proyecto: bahía de Paracas (Perú)
# Todas las coordenadas en grados decimales (lat negativa = Sur,
# lon negativa = Oeste). Todas las fechas en UTC.
# =====================================================================

proyecto:
  nombre: "Bahía de Paracas"
  zona_horaria_local: -5          # horas respecto de UTC (Perú, sin horario de verano)

# --- Dominio de estudio --------------------------------------------------
dominio:
  lat_min: -13.95
  lat_max: -13.60
  lon_min: -76.50
  lon_max: -76.15

# Punto representativo de la boca de la bahía (entre Punta Pejerrey y la costa este)
boca_bahia:
  lat: -13.80
  lon: -76.27

# --- Periodo ---------------------------------------------------------------
periodo:
  inicio: "2025-01-01"
  fin: "2026-10-31"               # último mes completo disponible

# --- Meteorología ----------------------------------------------------------
era5:
  dataset: "reanalysis-era5-single-levels"
  margen_grados: 0.5              # margen alrededor del dominio para la descarga
  variables:                      # nombres largos que usa el CDS
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - 2m_temperature
    - 2m_dewpoint_temperature
    - mean_sea_level_pressure
    - surface_solar_radiation_downwards
    - surface_thermal_radiation_downwards
    - total_precipitation
    - total_cloud_cover
  carpeta_raw: "data/raw/era5"

metar:
  estacion: "SPSO"                # Aeropuerto de Pisco (ICAO)
  lat: -13.7449                   # según el catálogo de IEM
  lon: -76.2203
  url: "https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py"
  carpeta_raw: "data/raw/metar"

vientos_paracas:
  umbral_ms: 10.0                 # viento mayor que este valor (m/s)
  hora_local_inicio: 12           # ventana horaria en hora local [inicio, fin]
  hora_local_fin: 18
  horas_minimas: 1                # horas sobre el umbral en la ventana para contar un día como evento
  fuente: "metar"                 # era5 | metar : fuente que define el mes candidato
  # "auto" = mes con más eventos según la fuente; "AAAA-MM" = mes fijado a mano.
  # Se fija 2025-01 (10 eventos en SPSO, empatado con 2025-03; en marzo no hay datos del mareógrafo IOC).
  mes_candidato: "2025-01"

# Viento del forzamiento meteorológico (lo escribe 04 en forzamiento_meteo_mes_candidato.csv)
forzamiento_viento:
  # spso    = viento observado en SPSO; huecos con ERA5 corregido y direcciones faltantes con ERA5
  # era5_qm = ERA5 de la boca corregido por mapeo de cuantiles contra SPSO (por hora local)
  # era5    = ERA5 de la boca sin corregir
  # Se usa spso: el mapeo de cuantiles iguala la intensidad, pero con validación cruzada pone los
  # eventos en los meses equivocados (enero 2025: 1 evento frente a 10 observados).
  metodo: "spso"

# --- Marea -----------------------------------------------------------------
mareografo:
  nombre: "Pisco"
  # Posición según IOC Sea Level Monitoring (estación 'pisco').
  # Valor aproximado del encargo: 13°43'S, 76°13'W (-13.7167, -76.2167).
  # El metadato de UHSLC (-13.4167, -76.1333) cae en Chincha, fuera del dominio: se ignora.
  lat: -13.8194
  lon: -76.2519

ioc:
  url: "https://www.ioc-sealevelmonitoring.org/service.php"
  estaciones: ["pisco", "pisc2"]  # la primera es la principal; la segunda llena huecos
  sensor_preferido:               # sensor a usar en cada estación
    pisco: "rad"
    pisc2: "prs"
  carpeta_raw: "data/raw/ioc"

uhslc:
  id: 683                         # verificado en https://uhslc.soest.hawaii.edu/data/meta.geojson
  url_rq: "https://uhslc.soest.hawaii.edu/data/csv/rqds/pacific/hourly/h683b.csv"
  url_fd: null                    # Pisco no tiene 'fast delivery' en UHSLC (404)
  valor_faltante: -32767
  # Año de referencia para el QC del IOC: 'auto' = año más completo (empates -> más reciente) o un año fijo.
  # Se fija 2015 porque desde mayo de 2016 hasta enero de 2025 el registro de Pisco tiene un error de escala
  # (amplitudes ×1,36–1,40 en todas las constituyentes, fases iguales; salto tras un hueco en abril de 2016).
  # Evidencia: Callao y San Juan no cambian y FES2022 coincide con Pisco 1992–2015 y con el IOC desde
  # ago-2025 (ver scripts/07b_control_vecinos.py). 2015: 99,1 % completo, último año limpio.
  anio_referencia: 2015
  carpeta_raw: "data/raw/uhslc"

analisis_marea:
  anio_ioc: "auto"                # 'auto' = ventana de 365 días más completa en el periodo, o 'AAAA-MM-DD' de inicio
  completitud_minima: 0.70        # fracción mínima de horas válidas para hacer el análisis
  tolerancia_empate: 0.005        # diferencia de completitud considerada empate
  destacar: ["M2", "S2", "N2", "K1", "O1", "P1"]
  serie_principal: "auto"         # auto | ioc | uhslc ('auto' = IOC si su ventana supera completitud_minima tras el QC)
  qc_referencia:                  # compara cada mes del IOC con la marea predicha a partir de UHSLC
    aplicar: true                 # descarta los meses que fallan
    r_min: 0.95                   # correlación mínima
    pendiente_tol: 0.10           # |pendiente obs/pred − 1| máxima (detecta errores de escala del sensor)

# Control externo del mareógrafo de Pisco con estaciones vecinas y FES2022 (scripts/07b_control_vecinos.py)
control_vecinos:
  # Mareógrafos UHSLC research quality, verificados en https://uhslc.soest.hawaii.edu/data/meta.geojson
  # (id, versión vigente y coordenadas consultadas el 2026-11-18)
  estaciones:
    - {nombre: "Callao", id: 93, lat: -12.06897, lon: -77.16673,
       url: "https://uhslc.soest.hawaii.edu/data/csv/rqds/pacific/hourly/h093b.csv",
       # fast delivery (sin QC final, llega hasta hace ~2 meses): compara el nivel medio con el IOC 2025-26
       url_fd: "https://uhslc.soest.hawaii.edu/data/csv/fast/hourly/h093.csv"}
    - {nombre: "San Juan de Marcona", id: 96, lat: -15.3667, lon: -75.2,
       url: "https://uhslc.soest.hawaii.edu/data/csv/rqds/pacific/hourly/h096b.csv"}
  constituyentes: ["M2", "S2", "N2", "K1", "O1", "P1"]
  anio_comparacion: 2022          # año común para comparar las tres estaciones con FES2022
  completitud_minima_anual: 0.60  # años con menos horas válidas no se analizan
  tolerancia_razon: 0.10          # |Pisco / media de vecinos − 1| mayor que esto marca el año como sospechoso

modelo_marea:
  nombre: "FES2022_extrapolated"  # nombre del modelo en la base de datos de pyTMD
  directorio: "data/raw/fes2022"  # carpeta que CONTIENE a fes2022b/ (la llena scripts/00_fes2022_download.py)
  archivos: "fes2022b/ocean_tide_extrapolated/*_fes2022.nc"   # patrón relativo a 'directorio'
  corte_extrapolacion_km: 10      # distancia máxima para extrapolar hacia la costa
  constituyentes: ["m2", "s2", "n2", "k2", "k1", "o1", "p1", "q1", "2n2", "m4", "ms4", "mn4", "mf", "mm", "ssa"]
  paso_minutos: 15
  # Descarga desde el FTP autenticado de AVISO (credenciales en ~/.netrc, nunca aquí)
  descarga:
    host: "ftp-access.aviso.altimetry.fr"
    carpeta_remota: "auxiliary/tide_model/fes2022b/ocean_tide_extrapolated"
    timeout_s: 120
    # Si la conexión se corta, se reconecta y se reanuda desde el último byte recibido
    reintentos: 8
    espera_reintento_s: 20
    # AVISO limita cada conexión a ~0,13 MB/s pero no el total: se bajan varios archivos a la vez
    conexiones_paralelas: 5
  # Fronteras abiertas del dominio (puntos equiespaciados sobre cada segmento)
  fronteras:
    norte: {lat_ini: -13.60, lon_ini: -76.50, lat_fin: -13.60, lon_fin: -76.20, n: 13}
    oeste: {lat_ini: -13.95, lon_ini: -76.50, lat_fin: -13.60, lon_fin: -76.50, n: 15}
    # El borde sur también es mar (en la malla de 250 m, agua entre -76.50 y -76.29): frontera abierta
    sur: {lat_ini: -13.95, lon_ini: -76.50, lat_fin: -13.95, lon_fin: -76.29, n: 10}

# --- Exportación a AEM3D (scripts/10_exportar_aem3d.py) ----------------------------
# Formato "Version 1" de los archivos de condiciones de contorno temporales, verificado en el manual
# (~/AEM3D/docs/AEM3D_User.pdf, sec. 3.7.2 y tabla 3.2) y en los ejemplos de ~/AEM3D/Model (Lagoon, test1).
aem3d:
  carpeta: "data/processed/aem3d"
  # Hora de la columna TIME: "local" (UTC-5, convención de la guía del curso en Model/test1) o "utc".
  # start_date_cwr de run_aem3d.dat debe usar la misma referencia.
  hora: "local"
  margen_horas: 24                # 04 y 07 extienden el forzamiento este margen a cada lado del mes
  # Número de conjunto de celdas de cada frontera abierta, tal como se definan en el bc.dat del
  # preprocesador (pre_aem3d). 0 está reservado para la superficie (meteorología).
  bc_frontera: {norte: 1, oeste: 2, sur: 3}
  # Onda larga: "CLOUDS" (nubosidad de ERA5; 9 columnas, formato de la guía del curso) o
  # "LW_RAD_IN" (radiación de onda larga incidente de ERA5, medida en vez de estimada).
  onda_larga: "CLOUDS"

# Malla del preprocesador de AEM3D (scripts/11_malla_aem3d.py). Formato de bathymetry.dat, bc.dat y
# run_pre.dat según el manual (cap. 2) y el ejemplo ~/AEM3D/Model/Lagoon/pre.
malla_aem3d:
  carpeta: "data/processed/aem3d/caso_paracas"   # caso completo: pre/ y run/ (como Model/Lagoon)
  dx_m: 250                       # celda horizontal uniforme (m); norte arriba (filas i hacia el sur)
  profundidad_minima_m: 1.5       # celdas de agua más someras se profundizan a este valor (evita secado)
  capas:                          # espesores de arriba hacia abajo (estiradas)
    dz_superficie_m: 1.0          # espesor constante cerca de la superficie...
    hasta_m: 25.0                 # ...hasta esta profundidad (cubre toda la bahía)
    factor: 1.15                  # luego cada capa es este factor más gruesa
    dz_max_m: 12.0                # espesor máximo de una capa
    margen_superior_m: 1.5        # altura de la malla sobre el nivel medio (marea alta + margen)
  # Ejecución. M3 Pro: 5 núcleos de rendimiento + 6 de eficiencia. Medido el 2026-11-18 con la prueba
  # de 6 h: 1 hilo 91 s; 5 hilos 33–45 s; 10–11 hilos 42–47 s (los núcleos lentos frenan a los demás).
  programa: "aem3d_openmp"        # aem3d (un núcleo) | aem3d_openmp (paralelo)
  hilos: 5                        # nthreads de run_aem3d.dat (solo lo usa aem3d_openmp)
  # La versión DEMO de AEM3D instalada permite como máximo 2 semanas de simulación
  # ("The maximum simulation time in the demo version of AEM3D is 2 weeks").
  max_dias_licencia: 14
  corrida:                        # simulación que queda lista en run/ (correr a mano con aem3d_openmp)
    inicio: "2025-01-18"          # fecha en la hora del modelo (aem3d.hora): los 14 días de enero 2025
                                  # con más eventos Paracas en SPSO (7 de 10: 18, 19, 22, 23, 24, 27 y 31)
    dias: 14
    del_t_s: 30
  prueba:                         # verificación corta (--correr) en prueba/, misma fecha de inicio
    horas: 6
    arranque_h: 3                 # horas iniciales de ajuste que no se comparan con FES2022

# --- Batimetría --------------------------------------------------------------
batimetria:
  gebco_nc: "data/raw/gebco/gebco_paracas.nc"   # recorte descargado del portal GEBCO
  poligono_bahia: "data/poligono_bahia.geojson"
  isobatas: [5, 10, 20, 30, 50, 75, 100]       # profundidades (m, positivas)
  perfiles:
    boca:          {lat_ini: -13.800, lon_ini: -76.292, lat_fin: -13.790, lon_fin: -76.240, n: 200}
    eje_bahia:     {lat_ini: -13.790, lon_ini: -76.270, lat_fin: -13.858, lon_fin: -76.265, n: 200}
    boca_exterior: {lat_ini: -13.790, lon_ini: -76.380, lat_fin: -13.760, lon_fin: -76.230, n: 200}

# --- Salidas -------------------------------------------------------------------
salidas:
  dpi: 300
  carpeta_figuras: "figures"
  carpeta_procesados: "data/processed"
